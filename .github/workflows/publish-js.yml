name: Publish JS package

# Triggered by tags of the form `@officespacesoftware/<package>@<version>`
# (e.g. `@officespacesoftware/release-management-core@1.1.0`). Push the tag and
# the matching package publishes to GitHub Packages.
#
# Stable versions may only be published from a commit reachable from `master`; see
# the "Verify commit is reachable from master" guard below. Prereleases — any version
# carrying a `-` suffix, such as `0.5.0-RC.0` — are exempt and publish from any
# branch under the `next` dist-tag, so an unfinished API can be exercised by real
# consumers without first being merged.
#
# A prerelease also takes `latest` when the package has no stable version at all:
# holding `latest` back protects the last stable release, and where there is none it
# only points a plain `npm install` at nothing. The first stable publish takes `latest`
# over permanently.

on:
  push:
    tags:
      - "@officespacesoftware/*@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. @officespacesoftware/release-management-core@1.1.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A dispatched run must inspect and publish the tag it was given, not the
          # ref the dispatch happened to be started from.
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history so `git merge-base --is-ancestor` below has the commits
          # it needs; the default shallow clone does not.
          fetch-depth: 0

      # Parsing comes first: whether the master guard applies depends on whether the
      # version being published is a prerelease.
      - name: Resolve tag and target package
        id: parse
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # TAG = @officespacesoftware/<pkg>@<version>
          # Strip leading "@" so rsplit on "@" works cleanly.
          BODY="${TAG#@}"             # officespacesoftware/<pkg>@<version>
          PKG_PATH="${BODY%@*}"        # officespacesoftware/<pkg>
          VER="${BODY##*@}"            # <version>
          PKG_NAME="@${PKG_PATH}"      # @officespacesoftware/<pkg>
          PKG_DIR_NAME="${PKG_PATH#officespacesoftware/}"  # <pkg>
          DIR="js/packages/${PKG_DIR_NAME}"
          if [ ! -f "${DIR}/package.json" ]; then
            echo "::error::Package directory ${DIR} does not exist for tag ${TAG}"
            exit 1
          fi
          # A `-` suffix marks a prerelease: 0.5.0-RC.0 is one, 0.5.0 is not.
          case "${VER}" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Verify commit is reachable from master
        if: steps.parse.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Refusing to publish: commit $GITHUB_SHA is not reachable from origin/master. Merge to master and re-tag the merged commit, or publish a prerelease version (e.g. ${{ steps.parse.outputs.version }}-RC.0) which is exempt from this check."
            exit 1
          fi
          echo "Commit $GITHUB_SHA is reachable from origin/master."

      - name: Note prerelease exemption
        if: steps.parse.outputs.prerelease == 'true'
        run: |
          echo "${{ steps.parse.outputs.version }} is a prerelease; skipping the master-reachability check and publishing under the 'next' dist-tag."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@officespacesoftware"
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Verify package.json version matches tag
        working-directory: ${{ steps.parse.outputs.dir }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${PKG_VER}" != "${{ steps.parse.outputs.version }}" ]; then
            echo "::error::Tag version ${{ steps.parse.outputs.version }} != package.json ${PKG_VER}"
            exit 1
          fi

      - name: Build workspace
        working-directory: js
        run: pnpm -r build

      # Prereleases go out under `next` so that `latest` keeps resolving to the last
      # stable release for anyone who installs without naming a version.
      - name: Publish to GitHub Packages
        working-directory: ${{ steps.parse.outputs.dir }}
        run: |
          set -euo pipefail
          if [ "${{ steps.parse.outputs.prerelease }}" = "true" ]; then
            pnpm publish --no-git-checks --access restricted --tag next
          else
            pnpm publish --no-git-checks --access restricted
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `latest` protects the last stable release — but only if there is one to protect.
      # On a package that has never published a stable version, holding `latest` back
      # points a plain `npm install` at nothing at all, so the newest prerelease should
      # take it. The first stable publish claims `latest` for itself and this step then
      # stops firing for good.
      - name: Point latest at this prerelease while no stable version exists
        id: latest
        if: steps.parse.outputs.prerelease == 'true'
        working-directory: ${{ steps.parse.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ steps.parse.outputs.pkg_name }}
          VER: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          # A stable version is one carrying no prerelease suffix. `npm view` answers a
          # bare string rather than an array when the package has exactly one version.
          STABLE=$(npm view "${PKG}" versions --json 2>/dev/null | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              let all = [];
              try { all = JSON.parse(s); } catch {}
              if (!Array.isArray(all)) all = all ? [all] : [];
              console.log(all.filter((v) => !String(v).includes("-")).join(" "));
            });
          ')
          if [ -n "${STABLE}" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "Stable version(s) exist (${STABLE}); leaving 'latest' where it is."
            exit 0
          fi
          npm dist-tag add "${PKG}@${VER}" latest
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "No stable version published yet; 'latest' now points at ${VER}."

      - name: Summarize
        run: |
          if [ "${{ steps.parse.outputs.prerelease }}" = "true" ]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          echo "Published ${{ steps.parse.outputs.pkg_name }}@${{ steps.parse.outputs.version }} under dist-tag ${DIST_TAG}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.latest.outputs.moved }}" = "true" ]; then
            echo "No stable version exists yet, so \`latest\` was also moved to this version." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Registry: https://npm.pkg.github.com" >> "$GITHUB_STEP_SUMMARY"
